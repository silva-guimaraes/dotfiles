---
- name: pacman install
  become: true
  when: pacman_install
  community.general.pacman:
    state: present
    name:
      - neovim
      - tree-sitter-cli

- name: apt install
  become: true
  when: apt_install
  ansible.builtin.apt:
    deb: https://github.com/neovim/neovim-releases/releases/download/v0.12.5/nvim-linux-x86_64.deb

- name: ensure .config/nvim
  ansible.builtin.file:
    name: ~/.config/nvim
    state: directory

- name: symlink config
  ansible.builtin.file:
    src: "~/dotfiles/roles/nvim/files/{{ item }}"
    path: "~/.config/nvim/{{ item }}"
    state: link
  loop:
    - init.lua
    - lua
    - nvim-pack-lock.json
