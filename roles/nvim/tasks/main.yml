---
- name: install
  become: true
  when: "{{ pacman_install }}"
  community.general.pacman:
    state: present
    name:
      - neovim
    
- name: symlink init.lua
  ansible.builtin.file:
    src: "~/dotfiles/roles/nvim/files/{{ item }}"
    path: "~/.config/nvim/{{ item }}"
    state: link
  loop:
    - init.lua
    - lua
