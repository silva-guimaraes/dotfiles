---
- name: install
  become: true
  when: pacman_install
  community.general.pacman:
    state: present
    name:
      - nsxiv

- name: ensure .config/nsxiv/exec
  ansible.builtin.file:
    name: ~/.config/nsxiv/exec
    state: directory

- name: symlink key-handler
  ansible.builtin.file:
    src: ~/dotfiles/roles/nsxiv/files/key-handler
    path: ~/.config/nsxiv/exec/key-handler
    state: link

- name: config xdg mime
  community.general.xdg_mime:
    handler: nsxiv.desktop
    mime_types:
      - image/bmp
      - image/gif
      - image/jpeg
      - image/jpg
      - image/png
      - image/tiff
      - image/x-bmp
      - image/x-portable-anymap
      - image/x-portable-bitmap
      - image/x-portable-graymap
      - image/x-tga
      - image/x-xpixmap
      - image/webp
      - image/heic
      - image/svg+xml
      - application/postscript
      - image/jp2
      - image/jxl
      - image/avif
      - image/heif
